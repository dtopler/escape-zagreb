name: scrape

# Publishes a fresh availability snapshot once an hour.
#
# Deliberately separate from the Pages build: this workflow only writes to the
# `data` branch, so the site is deployed once and never rebuilt per scrape.
# Committing to `main` instead would mean ~24 Pages builds/day for no benefit.

on:
  schedule:
    # :07 rather than :00 - GitHub queues a large share of the world's crons on
    # the hour, and off-peak minutes are far less likely to be delayed.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to scan"
        required: false
        default: "21"

permissions:
  contents: write

# never run two scrapes at once; queue instead of cancelling a half-done scan
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the stale cache is what lets a blocked/throttled provider fall back to
      # its last known answer instead of publishing "nothing free"
      - name: restore scraper caches
        uses: actions/cache@v4
        with:
          path: |
            data/slot_cache.json
            data/stale_cache.json
          key: scraper-cache-${{ github.run_id }}
          restore-keys: |
            scraper-cache-

      - name: scrape
        env:
          # stream output instead of dumping it when the process exits, so the
          # run page shows progress and per-provider timings while it works
          PYTHONUNBUFFERED: "1"
          # keep the cross-run cache shorter than the cycle, so every run really
          # re-reads the providers instead of answering from cache
          ESCAPE_CACHE_TTL: "600"
          # hard ceilings: the whole scan stops starting new work at 12 min and
          # publishes what it has, so the job always lands inside 15
          ESCAPE_SCAN_BUDGET: "720"
          # no single provider may eat more than 4 min of the scan
          ESCAPE_PROVIDER_BUDGET: "240"
          # Portal Escape answers nothing from datacenter IPs (0 slots, 4/4 rooms
          # erroring, ~400s wasted) - skip it entirely until that changes
          ESCAPE_SKIP_PROVIDERS: "portal"
        run: python aggregate.py ${{ github.event.inputs.days || '21' }}

      - name: verify snapshot
        run: |
          python - <<'PY'
          import json, sys
          doc = json.load(open("data/availability.json", encoding="utf-8"))
          rooms = [r for r in doc["rooms"] if r["total_slots"]]
          total = sum(r["total_slots"] for r in doc["rooms"])
          print(f"{len(rooms)} rooms with slots / {len(doc['rooms'])} rooms, {total} slots")
          print(f"window {doc['window']['start']} .. {doc['window']['end']}")
          if not rooms:
              sys.exit("every room came back empty - keeping the previous snapshot")
          PY

      - name: publish to data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/publish && mkdir -p /tmp/publish
          cp data/availability.json /tmp/publish/data.json
          cd /tmp/publish
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # keeps the token out of the remote URL (and therefore out of logs)
          git config "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git add data.json
          git commit -qm "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force origin data:data
          echo "published $(wc -c < data.json) bytes to the data branch"
